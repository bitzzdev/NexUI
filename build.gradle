plugins {
    // Minecraft 26.1+ are non-obfuscated releases. Loom's `net.fabricmc.fabric-loom` plugin id
    // is the one to use for non-obfuscated versions (it skips all remapping).
    // Do NOT use the `fabric-loom-remap` id for 26.2.
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

loom {
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // Non-obfuscated Minecraft versions use plain `implementation` for mod dependencies —
    // the `modImplementation`/`modApi` variants are for remapping setups only.
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

java {
    // Minecraft 26.2 requires Java 25 (java-runtime-epsilon).
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
